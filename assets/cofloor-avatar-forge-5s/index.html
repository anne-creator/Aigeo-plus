<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>CoFloor · Avatar Forge · 5 seconds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="player" aria-label="CoFloor 人脸扫描与 3D 数字员工生成演示">
  <canvas id="film" width="1920" height="1080" aria-label="人脸扫描、全息 3D 头模、粒子聚合及 3D 员工展示">CoFloor：从人脸扫描到 3D 员工的动态演示。</canvas>
  <div id="loading" role="status">正在准备数字员工生成舱…</div>
  <div class="transport">
    <button id="play" type="button">暂停</button>
    <button id="replay" type="button">重新生成</button>
    <label class="seek-label"><span class="sr-only">播放进度</span><input id="seek" type="range" min="0" max="5" value="0" step="0.01"></label>
    <output id="time">00:00 / 00:05</output>
    <button id="sound" type="button" aria-pressed="false">音效：关</button>
    <button id="full" type="button">全屏</button>
  </div>
  <p class="note">概念动效 · 虚构员工 · 程序化 3D 模型 <span>拖动进度查看每个生成阶段</span></p>
</main>
<script type="module" src="player.js"></script>
</body>
</html>
